; =====================================================================
;  ESP32-S3 AI 助手 - PlatformIO 配置 (v0.3.0)
;  硬件: ESP32-S3-DevKitC-1-N16R8 + 2.8" ILI9341 触摸屏
;  变更: 放弃 TFT_eSPI (v3.x 兼容性 bug), 改用 Adafruit ILI9341
; =====================================================================

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform        = espressif32@^6.5.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600

; N16R8: 16MB Flash + 8MB Octal PSRAM.
; DevKitC-1-N16R8 = 16MB Quad-SPI Flash + 8MB Octal PSRAM (NOT Octal Flash).
; Default devkitc board is N8/No PSRAM; wrong memory config causes boot loop.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.filesystem = littlefs

; ---------- 库依赖 ----------
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit ILI9341@^1.6.1
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4

; ---------- 编译选项 ----------
build_flags =
    ; ---- USB 配置: 走 UART0 (用户能看到所有日志) ----
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

    ; ---- 调试输出 ----
    -DCORE_DEBUG_LEVEL=1

    ; ---- 启用板载 PSRAM ----
    -DBOARD_HAS_PSRAM

    ; ---- 主循环任务栈 8K -> 16K (mbedTLS 握手在大栈上才安全) ----
    -DARDUINO_LOOP_STACK_SIZE=16384

; ---------- 串口监视器 ----------
monitor_filters = esp32_exception_decoder, time

; ---------- 分区表 (4MB app x2 OTA + 约7.9MB LittleFS + 64KB coredump) ----------
board_build.partitions = partitions_16MB.csv
